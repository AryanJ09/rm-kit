name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Token audit
        run: pnpm --filter=v4 audit:tokens
      - name: Typecheck
        run: pnpm --filter=v4 typecheck
      - name: Build Storybook
        run: pnpm --filter=v4 build-storybook
